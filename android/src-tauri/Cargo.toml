[package]
name = "hand-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Hand's Android Companion"
license = "MIT"
publish = false

[lib]
name = "hand_android_lib"
crate-type = ["cdylib"]

[dependencies]
hand-android-core = { path = "../core" }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"
ndk-context = "=0.1.1"
