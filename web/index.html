<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hand's Android Companion</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Hand's Android Companion</h1>
      <p>Debug build. Pairing is not built yet, so this screen takes the laptop's details by hand.</p>
      <dl>
        <dt>Proxy</dt>
        <dd id="proxy" class="quiet">starting…</dd>
        <dt>This phone</dt>
        <dd id="phone" class="quiet">starting…</dd>
      </dl>
      <p id="status" class="quiet"></p>
      <form id="open">
        <label for="endpoint">Laptop endpoint ID</label>
        <input id="endpoint" name="endpoint" autocomplete="off" spellcheck="false" required>
        <label for="relay">Relay URL (optional)</label>
        <input id="relay" name="relay" autocomplete="off" spellcheck="false" placeholder="https://relay.example.test/">
        <label for="fleet">Fleet ID (optional, opens its pairing page)</label>
        <input id="fleet" name="fleet" autocomplete="off" spellcheck="false" placeholder="f0123456789ab">
        <button type="submit">Open the Board</button>
      </form>
      <p class="quiet">This temporary field stores nothing. A Board that asks for a login shows its own login page in this web view.</p>
      <p id="core" class="error"></p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
