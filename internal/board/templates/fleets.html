{{define "fleets.html"}}{{template "head" .}}<main>
<h1>Fleets</h1>
{{if .Loopback}}{{range .Fleets}}<section class="card"><h2><a href="/{{.ID}}/">{{.Name}}</a></h2><div class="row muted">{{.ID}}</div></section>
{{else}}<p class="muted">No fleets yet. Run <code>hand init</code> in a folder.</p>
{{end}}{{else}}<p>Open a fleet's link from <code>hand open</code>.</p>
{{end}}</main>
{{template "foot"}}{{end}}
