{{define "pair.html"}}{{template "head" .}}<main class="thread pair">
<header class="thread-head"><h2 class="thread-title">Pair this phone</h2></header>
<form class="card pair-card" method="post" data-pair><div class="part-body pair-form">
<label for="code">Code from the Board on your laptop</label>
<input id="code" name="code" required autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="XXXXX-XXXXX" maxlength="13"{{with .Error}} aria-invalid="true" aria-describedby="code-error"{{end}}>
{{with .Error}}<p class="field-error" id="code-error" role="alert">{{.}}</p>{{end}}
<label for="name">Name for this phone</label>
<input id="name" name="name" maxlength="40" autocomplete="off" value="{{.Name}}">
{{with .Login}}<p class="meta">Pairing for the tailnet login {{.}}.</p>{{end}}
<button class="primary">Pair</button>
</div></form>
</main>
{{template "foot"}}{{end}}
