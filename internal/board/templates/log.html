{{define "log.html"}}{{template "head" .}}<main class="log">
{{range .Entries}}<div class="msg {{.Role}}{{if .Queued}} queued{{end}}"><div class="muted">{{.Role}} · {{.At}}</div><pre>{{.Text}}</pre></div>
{{end}}{{with .Note}}<p class="muted">{{.}}</p>
{{end}}<div class="row muted">{{if .Live}}<a href="/supervisor/log?live=0">pause</a>{{else}}<a href="/supervisor/log">live</a>{{end}}{{if .Older}} · <a href="/supervisor/log?before={{.Older}}">older</a>{{end}}</div>
</main>
{{template "foot"}}{{end}}
