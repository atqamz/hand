{{define "index.html"}}{{template "head" .}}<header>
<h1>{{.Fleet}}</h1>
{{if .All}}<a href="{{.Base}}/">hide finished</a>{{else}}<a href="{{.Base}}/?all=1">show finished</a>{{end}}
</header>
<main class="grid">
<div>
<section class="panel" data-region="status">{{template "region-status" .}}</section>
<section class="timeline" data-region="timeline">{{template "region-timeline" .}}</section>
{{if .Controls}}<form id="composer" method="post" action="{{.Base}}/supervisor/send" data-fetch>
<input type="hidden" name="csrf" value="{{.Token}}">
<textarea name="text" required placeholder="Message the supervisor"></textarea>
<div class="row"><button>Send</button> <button type="button" id="notify" hidden>Notify me</button></div>
</form>{{end}}
</div>
<div>
<section class="queue" data-region="queue">{{template "region-queue" .}}</section>
<section data-region="tasks">{{template "region-tasks" .}}</section>
</div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
{{template "foot"}}{{end}}
