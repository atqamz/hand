{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>{{.Title}} · {{.Fleet}}</title>
<link rel="stylesheet" href="{{asset "board.css"}}">
<link rel="icon" href="{{asset "favicon.svg"}}">
<script src="{{asset "app.js"}}" defer></script>
</head>
<body class="tint-{{tint .FleetID}}" data-page="{{.Page}}" data-base="{{.Base}}" data-fleet="{{.Fleet}}">
{{end}}

{{define "top"}}<header class="top"><div class="top-inner"><a class="brand" href="{{.Base}}/">{{template "icon-mark"}}<h1>{{.Fleet}}</h1></a>{{with .FleetID}}<span class="ref fleet-id">{{.}}</span>{{end}}<span class="spacer"></span>{{if .FleetID}}<button type="button" id="notify" class="quiet-button" hidden>{{template "icon-bell"}} Notify me</button>{{end}}</div></header>
{{end}}

{{define "foot"}}</body>
</html>
{{end}}
