name: "[CI] Publish"

on:
  push:
    branches: [main]
    tags: ["v*", "android-v*"]
  workflow_dispatch:
    inputs:
      job:
        description: The job to run by hand.
        required: true
        type: choice
        options: [main-apk, release, android-release]
      tag:
        description: Release tag to attach binaries to, such as v0.8.0; only for the release job.
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.job == 'release')) && format('release-{0}', inputs.tag || github.ref_name) || format('publish-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:

  detect-changes:
    name: "[CI] Detect Changes"
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: bash .github/scripts/detect-changes.sh

  www-build:
    name: "[WWW] Build"
    needs: detect-changes
    if: github.ref == 'refs/heads/main' && needs.detect-changes.outputs.docs == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./www/gen -out www/dist -version "$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: www/dist

  www-deploy:
    name: "[WWW] Deploy"
    needs: www-build
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release-tag:
    name: "[Release] Tag"
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.job == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TAG_INPUT: ${{ inputs.tag }}
    steps:
      - name: Check the tag
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -z "$TAG_INPUT" ]; then
            echo "the release job needs the tag input, such as v0.8.0" >&2
            exit 1
          fi
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "not a release tag: $TAG" >&2; exit 1 ;;
          esac

  release-e2e:
    name: "[Release] E2E Install"
    needs: release-tag
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-install.yaml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  release-binaries:
    name: "[Release] Binaries"
    needs: release-e2e
    runs-on: ubuntu-latest
    outputs:
      iroh: ${{ steps.iroh.outputs.present }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "not a release tag: $TAG" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Check the tag still names the tested commit
        env:
          TESTED: ${{ needs.release-e2e.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED"
      - id: iroh
        run: |
          if [ -f iroh/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - run: go test -race -timeout 30m ./...
      - name: Build
        run: |
          set -eu
          sh .github/scripts/build-dist.sh "${TAG#v}" stable "$(git rev-parse HEAD)"
          sh .github/scripts/build-desktop.sh "${TAG#v}" stable "$(git rev-parse HEAD)"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "$TAG" --notes "Draft: write the notes, then publish." --verify-tag
          fi
          gh release upload "$TAG" hand-linux-amd64.tar.gz hand-linux-arm64.tar.gz hand-darwin-amd64.tar.gz hand-darwin-arm64.tar.gz checksums.txt hand-windows-amd64.zip hand-windows-amd64.sha256 hand-desktop-linux-amd64.tar.gz hand-desktop-linux-amd64.sha256 hand-desktop-linux-arm64.tar.gz hand-desktop-linux-arm64.sha256 hand-desktop-darwin-arm64.tar.gz hand-desktop-darwin-arm64.sha256 hand-desktop-darwin-amd64.tar.gz hand-desktop-darwin-amd64.sha256 hand-desktop-windows-amd64.zip hand-desktop-windows-amd64.sha256 --clobber
      - name: Attest
        continue-on-error: true
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            hand-*.tar.gz
            checksums.txt
            hand-windows-amd64.zip
            hand-windows-amd64.sha256
            hand-desktop-*.tar.gz
            hand-desktop-windows-amd64.zip
            hand-desktop-*.sha256

  release-iroh:
    name: "[Release] Iroh"
    needs: [release-e2e, release-binaries]
    if: needs.release-binaries.outputs.iroh == 'true'
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/iroh.yaml
    with:
      ref: ${{ needs.release-e2e.outputs.sha }}
      tag: ${{ inputs.tag || github.ref_name }}

  android-release:
    name: "[Android] Release"
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/android-v')) || (github.event_name == 'workflow_dispatch' && inputs.job == 'android-release')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag against the version, the versionCode and the pinned key
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          [[ $tag =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not an android release tag: $tag" >&2; exit 1; }
          version="${tag#android-v}"
          [[ $version =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$ ]]
          IFS=. read -r major minor patch <<<"$version"
          test "$minor" -lt 1000
          test "$patch" -lt 1000
          test "$major" -lt 2100
          version_file=android/version.properties
          test "$(sed -n 's/^version=//p' "$version_file")" = "$version"
          test "$(sed -n 's/^versionCode=//p' "$version_file")" -eq $((major * 1000000 + minor * 1000 + patch))
          [[ "$(cat android/release-key.sha256)" =~ ^[0-9a-f]{64}$ ]]
          { echo "VERSION=$version"; echo "APK=hand-android-$version.apk"; } >> "$GITHUB_ENV"
      - uses: ./.github/actions/build-signed-apk
        id: build
        with:
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      - name: Check the APK
        working-directory: android
        run: |
          set -eu
          apk="${{ steps.build.outputs.path }}"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$apkanalyzer" manifest version-name "$apk")" = "$VERSION"
          test "$("$apkanalyzer" manifest version-code "$apk")" = "$(sed -n 's/^versionCode=//p' version.properties)"
          scripts/check-jni-keep.sh "$apk"
          mv "$apk" "$RUNNER_TEMP/$APK"
      - name: Attach the APK to a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false --title "$GITHUB_REF_NAME" --generate-notes "$RUNNER_TEMP/$APK"
      - name: Check that the app release did not take the latest slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || true)
          if [ "$latest" = "$GITHUB_REF_NAME" ]; then
            gh release edit "$GITHUB_REF_NAME" --latest=false
            echo "hand update resolves to $GITHUB_REF_NAME now" >&2
            exit 1
          fi

  android-main-apk:
    name: "[Android] Main APK"
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'main-apk' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version, versionCode and pinned key
        run: |
          version="$(sed -n 's/^version=//p' version.properties)"
          version_code="$(sed -n 's/^versionCode=//p' version.properties)"
          [[ $version =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$ ]]
          IFS=. read -r major minor patch <<<"$version"
          test "$minor" -lt 1000
          test "$patch" -lt 1000
          test "$major" -lt 2100
          expected=$((major * 1000000 + minor * 1000 + patch))
          test "$version_code" -eq "$expected"
          [[ "$(cat release-key.sha256)" =~ ^[0-9a-f]{64}$ ]]
          echo "versionName $version, versionCode $version_code, expected $expected"
      - uses: ./.github/actions/build-signed-apk
        id: build
        with:
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      - name: Check the APK
        run: |
          apk="${{ steps.build.outputs.path }}"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test "$("$apkanalyzer" manifest version-name "$apk")" = "$(sed -n 's/^version=//p' version.properties)"
          test "$("$apkanalyzer" manifest version-code "$apk")" = "$(sed -n 's/^versionCode=//p' version.properties)"
          scripts/check-jni-keep.sh "$apk"
      - name: Report the APK
        run: |
          apk="${{ steps.build.outputs.path }}"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          version_name="$("$apkanalyzer" manifest version-name "$apk")"
          version_code="$("$apkanalyzer" manifest version-code "$apk")"
          sha256="$(sha256sum "$apk" | cut -d' ' -f1)"
          { echo "versionName $version_name"; echo "versionCode $version_code"; echo "sha256 $sha256"; } | tee -a "$GITHUB_STEP_SUMMARY"
          mv "$apk" "$RUNNER_TEMP/hand-android-main.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hand-android-main-apk
          path: ${{ runner.temp }}/hand-android-main.apk
          if-no-files-found: error
          retention-days: 7
