name: Iroh

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and test; the default is the ref that triggered the run.
        type: string
        default: ""
      tag:
        description: Release tag to attach the assets to; empty builds everything and uploads nothing.
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - iroh/**
      - internal/board/peer.go
      - .github/workflows/iroh.yaml
  pull_request:
    branches: [main]
    paths:
      - iroh/**
      - internal/board/peer.go
      - .github/workflows/iroh.yaml

permissions:
  contents: read

concurrency:
  group: iroh-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: iroh

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: check ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  check-targets:
    name: check ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: linux-arm64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
          - name: darwin-amd64
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      TARGET: ${{ matrix.target }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: Install the musl C compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - run: cargo test --locked --target "$TARGET"

  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: tar.gz
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: tar.gz
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - name: darwin-amd64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: tar.gz
          - name: windows-amd64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      NAME: ${{ matrix.name }}
      TARGET: ${{ matrix.target }}
      ASSET: hand-iroh-${{ matrix.name }}.${{ matrix.ext }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install the pinned toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: Install the musl C compiler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.tag == ''
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            iroh/target
          key: iroh-build-${{ matrix.name }}-${{ hashFiles('iroh/Cargo.lock', 'iroh/rust-toolchain.toml') }}
          restore-keys: iroh-build-${{ matrix.name }}-
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target "$TARGET"
      - name: Check the binary
        run: |
          set -eu
          bin=target/$TARGET/release/hand-iroh
          if [ "$RUNNER_OS" = Windows ]; then bin=$bin.exe; fi
          echo "$bin is $(wc -c <"$bin") bytes"
          "$bin" --version | grep -q "^hand-iroh $(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1) iroh "
          if [ "$RUNNER_OS" = Linux ] && ldd "$bin" 2>&1 | grep -q '=>'; then
            echo "$bin is not statically linked" >&2
            exit 1
          fi
      - name: Run the binary
        timeout-minutes: 3
        run: |
          set -eu
          bin=$PWD/target/$TARGET/release/hand-iroh
          if [ "$RUNNER_OS" = Windows ]; then bin=$bin.exe; fi
          home=$(mktemp -d)
          printf '%s\n' feedfacefeedfacefeedfacefeedfacefeedface >"$home/secret"
          for run in 1 2; do
            (sleep 5) | "$bin" --board 127.0.0.1:9 --relay none --secret-file "$home/secret" --key-dir "$home/keys" >"$home/out$run"
            grep -Eq '^ready id=[0-9a-f]{64} relay=none$' "$home/out$run"
          done
          cmp "$home/out1" "$home/out2"
      - name: Pack
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf "dist/$ASSET" -C "target/$TARGET/release" hand-iroh
      - name: Pack
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Compress-Archive -LiteralPath "target/$env:TARGET/release/hand-iroh.exe" -DestinationPath "dist/$env:ASSET"
      - name: Checksum
        working-directory: iroh/dist
        run: |
          set -eu
          digest() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$@"
            else
              shasum -a 256 "$@"
            fi
          }
          digest "$ASSET" >"hand-iroh-$NAME.sha256"
          digest -c "hand-iroh-$NAME.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hand-iroh-${{ matrix.name }}
          path: iroh/dist/*
          retention-days: 3
          if-no-files-found: error

  publish:
    if: inputs.tag != ''
    needs: [check, check-targets, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hand-iroh-*
          merge-multiple: true
          path: dist
      - name: Check
        run: |
          set -eu
          cd dist
          test "$(find . -type f | wc -l)" -eq 10
          sha256sum -c ./*.sha256
      - name: Publish
        run: gh release upload "$TAG" dist/hand-iroh-* --clobber --repo "$GITHUB_REPOSITORY"
      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/hand-iroh-*
