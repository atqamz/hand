name: Retire superseded chat merge CI

on:
  push:
    branches: [review/chat-20260921]
    paths: [.github/workflows/chat-review-queue.yml]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  retire-superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel only superseded CI from this review
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import json, os, urllib.request, urllib.error
          root = 'https://api.github.com/repos/atqamz/hand/'
          headers = {'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path, headers=headers), timeout=30) as response:
                  return json.load(response)
          def cancel(run):
              if run['status'] not in ('queued', 'in_progress') or run['name'] != 'CI':
                  return
              try:
                  request = urllib.request.Request(root+'actions/runs/'+str(run['id'])+'/cancel', data=b'', headers=headers, method='POST')
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print('Cancelled obsolete CI', run['id'], run['event'], run['head_sha'], response.status)
              except urllib.error.HTTPError as error:
                  if error.code != 409 or get('actions/runs/'+str(run['id']))['status'] != 'completed':
                      raise
                  print('Already completed', run['id'])
          latest = get('git/ref/heads/main')['object']['sha']
          for sha in ('650a7c616ac6da55a1d7a6653d4ef8cc34333140', '700367514ff4e15fd7399de6aaff7e2fbcb06ff3', '86ffe7406ad7a3dcff5e62f6c52e122fe1d53c32'):
              if sha == latest:
                  continue
              comparison = get('compare/'+sha+'...'+latest)
              assert comparison['status'] == 'ahead' and comparison['behind_by'] == 0, 'not a superseded ancestor'
              for run in get('actions/runs?head_sha='+sha+'&event=push&per_page=100')['workflow_runs']:
                  if run['event'] == 'push' and run['head_branch'] == 'main' and run['head_sha'] == sha:
                      cancel(run)
          reviewed = {number: get('pulls/'+str(number)) for number in (516, 587, 590, 595, 596)}
          for run in get('actions/runs?event=pull_request&per_page=100')['workflow_runs']:
              if run['name'] != 'CI' or run['status'] not in ('queued', 'in_progress'):
                  continue
              numbers = {pr['number'] for pr in run['pull_requests']}
              if len(numbers) != 1:
                  continue
              number = next(iter(numbers))
              pr = reviewed.get(number)
              if pr is None or pr['state'] != 'open' or pr['head']['sha'] == run['head_sha']:
                  continue
              comparison = get('compare/'+run['head_sha']+'...'+pr['head']['sha'])
              if comparison['status'] == 'ahead' and comparison['behind_by'] == 0:
                  cancel(run)
          print('Preserved current PR heads, every release workflow and current main', latest)
