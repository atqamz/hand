name: Edge

on:
  workflow_call:
    inputs:
      sha:
        description: Tested main commit to publish when still eligible.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hand-edge-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Check edge candidate
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
      - name: Check candidate ancestry
        id: check
        env:
          CANDIDATE: ${{ inputs.sha }}
        run: |
          set -eu
          git fetch --force origin main
          set +e
          git ls-remote --exit-code origin refs/tags/edge >/dev/null
          edge_status=$?
          set -e
          case "$edge_status" in
            0) git fetch --force origin refs/tags/edge:refs/tags/edge ;;
            2) ;;
            *) echo "could not determine whether the edge tag exists" >&2; exit 1 ;;
          esac

          if ! git merge-base --is-ancestor "$CANDIDATE" origin/main; then
            echo "candidate $CANDIDATE is not in current main history; skipping" >&2
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify refs/tags/edge >/dev/null 2>&1; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          edge=$(git rev-parse refs/tags/edge)
          if [ "$CANDIDATE" = "$edge" ]; then
            echo "candidate already names edge; skipping" >&2
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "$CANDIDATE" "$edge"; then
            echo "candidate is older than edge; skipping" >&2
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$edge" "$CANDIDATE"; then
            echo "candidate and edge histories diverge; refusing to publish" >&2
            echo "recover by resetting the tag onto current main: git push origin +$CANDIDATE:refs/tags/edge" >&2
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build (unix)
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          CANDIDATE: ${{ inputs.sha }}
        run: |
          set -eu
          version="edge.${CANDIDATE:0:12}"
          go build -ldflags "-s -w -X main.version=${version} -X main.channel=edge -X main.commit=${CANDIDATE}" -o hand .
          if [ "$GOOS" = linux ] && [ "$GOARCH" = amd64 ]; then
            test "$(./hand --version)" = "$version"
          fi
          tar czf "hand-${GOOS}-${GOARCH}.tar.gz" hand
      - name: Build (windows)
        if: matrix.goos == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          CANDIDATE: ${{ inputs.sha }}
        run: |
          set -eu
          version="edge.${CANDIDATE:0:12}"
          go build -ldflags "-s -w -X main.version=${version} -X main.channel=edge -X main.commit=${CANDIDATE}" -o hand.exe .
          zip "hand-${GOOS}-${GOARCH}.zip" hand.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hand-${{ matrix.goos }}-${{ matrix.goarch }}
          path: hand-${{ matrix.goos }}-${{ matrix.goarch }}.*

  publish:
    name: Publish rolling release
    needs: [prepare, build]
    if: needs.prepare.outputs.eligible == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum hand-*.tar.gz hand-*.zip > checksums.txt
      - name: Final ancestry check
        id: final-check
        env:
          CANDIDATE: ${{ inputs.sha }}
        run: |
          set -eu
          git fetch --force origin main
          set +e
          git ls-remote --exit-code origin refs/tags/edge >/dev/null
          edge_status=$?
          set -e
          case "$edge_status" in
            0) git fetch --force origin refs/tags/edge:refs/tags/edge ;;
            2) ;;
            *) echo "could not determine whether the edge tag exists" >&2; exit 1 ;;
          esac

          if ! git merge-base --is-ancestor "$CANDIDATE" origin/main; then
            echo "candidate is no longer in main history; skipping" >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify refs/tags/edge >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          edge=$(git rev-parse refs/tags/edge)
          if [ "$CANDIDATE" = "$edge" ] || git merge-base --is-ancestor "$CANDIDATE" "$edge"; then
            echo "edge advanced past candidate; skipping" >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$edge" "$CANDIDATE"; then
            echo "candidate and edge histories diverge; refusing to publish" >&2
            echo "recover by resetting the tag onto current main: git push origin +$CANDIDATE:refs/tags/edge" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Create edge release
        if: steps.final-check.outputs.publish == 'true'
        env:
          CANDIDATE: ${{ inputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > edge-notes.md <<EOF
          This is the rolling development build for maintainers and contributors.

          Source commit: ${CANDIDATE}
          Channel: edge
          CI status: passed

          This release and its \`edge\` tag are intentionally mutable and are replaced after newer \`main\` commits pass the complete CI gate.

          Not intended as the stable release channel.
          EOF
          assets=(
            hand-linux-amd64.tar.gz
            hand-linux-arm64.tar.gz
            hand-darwin-amd64.tar.gz
            hand-darwin-arm64.tar.gz
            hand-windows-amd64.zip
            checksums.txt
          )
          repo=atqamz/hand
          all_assets() {
            gh api --paginate "repos/${repo}/releases/${release_id}/assets?per_page=100" "$@"
          }
          asset_id() {
            all_assets --jq "first(.[] | select(.name == \"$1\") | .id) // empty"
          }
          rename_asset() {
            gh api --method PATCH "repos/${repo}/releases/assets/$1" -f name="$2" >/dev/null
          }
          delete_asset() {
            gh api --method DELETE "repos/${repo}/releases/assets/$1" >/dev/null
          }

          release_tag=edge
          bootstrap_tag=""
          release_id=$(gh api --paginate "repos/${repo}/releases?per_page=100" \
            --jq 'first(.[] | select(.tag_name == "edge") | .id) // empty')
          if [ -z "$release_id" ]; then
            # A draft reserves its tag name without creating the ref, which GitHub
            # writes only on publish, so a temporary tag leaves edge unclaimed
            # until the complete asset set is promoted.
            bootstrap_tag="edge-bootstrap-${CANDIDATE}"
            release_tag=$bootstrap_tag
            stale_drafts=$(gh api --paginate "repos/${repo}/releases?per_page=100" \
              --jq '.[] | select(.tag_name | startswith("edge-bootstrap-")) | .id')
            for stale in $stale_drafts; do
              gh api --method DELETE "repos/${repo}/releases/${stale}" >/dev/null
            done
            gh release create "$bootstrap_tag" --repo "$repo" --target "$CANDIDATE" --title Edge --prerelease --draft --notes-file edge-notes.md
            release_id=$(gh release view "$bootstrap_tag" --repo "$repo" --json databaseId --jq .databaseId)
          fi

          # A run killed between the backup and promote loops leaves the only copy
          # of an exact-name asset under edge-previous-*. Restore those first, and
          # discard leftovers only once the exact-name set is whole again.
          unbacked=0
          for asset in "${assets[@]}"; do
            existing=$(asset_id "$asset")
            if [ -n "$existing" ]; then
              continue
            fi
            orphan=$(all_assets --jq "first(.[] | select(.name | startswith(\"edge-previous-\") and endswith(\"-${asset}\")) | .id) // empty")
            if [ -z "$orphan" ]; then
              unbacked=$((unbacked + 1))
              continue
            fi
            rename_asset "$orphan" "$asset"
          done
          if [ "$unbacked" -eq 0 ]; then
            stale_ids=$(all_assets --jq '.[] | select(.name | startswith("edge-staging-") or startswith("edge-previous-")) | .id')
            for stale in $stale_ids; do
              delete_asset "$stale"
            done
          fi

          staging_assets=()
          for asset in "${assets[@]}"; do
            staging="edge-staging-${CANDIDATE}-${asset}"
            existing=$(asset_id "$staging")
            if [ -n "$existing" ]; then
              delete_asset "$existing"
            fi
            cp "$asset" "$staging"
            staging_assets+=("$staging")
          done

          declare -A backup_of=()
          declare -A promoted=()
          rollback() {
            status=$?
            if [ "$status" -eq 0 ]; then
              return
            fi
            set +e
            for index in "${!promoted[@]}"; do
              promoted_id=$(asset_id "${assets[$index]}")
              if [ -n "$promoted_id" ]; then
                rename_asset "$promoted_id" "${staging_assets[$index]}"
              fi
            done
            for index in "${!backup_of[@]}"; do
              backup_id=$(asset_id "${backup_of[$index]}")
              if [ -n "$backup_id" ]; then
                rename_asset "$backup_id" "${assets[$index]}"
              fi
            done
            for staging in "${staging_assets[@]}"; do
              staging_id=$(asset_id "$staging")
              if [ -n "$staging_id" ]; then
                delete_asset "$staging_id"
              fi
            done
            if [ -n "$bootstrap_tag" ]; then
              gh api --method DELETE "repos/${repo}/releases/${release_id}" >/dev/null
            fi
            exit "$status"
          }
          trap rollback EXIT

          # Upload under unique names so a failed candidate upload leaves the
          # previous exact-name assets available to edge clients.
          gh release upload "$release_tag" --repo "$repo" "${staging_assets[@]}"
          for staging in "${staging_assets[@]}"; do
            staged_id=$(asset_id "$staging")
            test -n "$staged_id"
          done

          for index in "${!assets[@]}"; do
            final=${assets[$index]}
            old_asset_id=$(asset_id "$final")
            if [ -z "$old_asset_id" ]; then
              continue
            fi
            backup="edge-previous-${CANDIDATE}-${final}"
            clashing_id=$(asset_id "$backup")
            if [ -n "$clashing_id" ]; then
              delete_asset "$clashing_id"
            fi
            rename_asset "$old_asset_id" "$backup"
            backup_of[$index]=$backup
          done
          for index in "${!assets[@]}"; do
            staged_asset_id=$(asset_id "${staging_assets[$index]}")
            test -n "$staged_asset_id"
            rename_asset "$staged_asset_id" "${assets[$index]}"
            promoted[$index]=1
          done
          for index in "${!backup_of[@]}"; do
            backup_asset_id=$(asset_id "${backup_of[$index]}")
            if [ -n "$backup_asset_id" ]; then
              delete_asset "$backup_asset_id"
            fi
          done
          trap - EXIT

          # Publishing before the tag moves keeps edge from naming a commit
          # whose complete asset set is not yet available.
          if [ -n "$bootstrap_tag" ]; then
            gh release edit "$bootstrap_tag" --repo "$repo" --tag edge --title Edge --prerelease --draft=false --notes-file edge-notes.md
            git push origin ":refs/tags/${bootstrap_tag}" >/dev/null 2>&1 || true
          else
            gh release edit edge --repo "$repo" --title Edge --prerelease --draft=false --notes-file edge-notes.md
          fi
          git tag -f edge "$CANDIDATE"
          git push origin refs/tags/edge --force
