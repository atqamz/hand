name: Edge

on:
  workflow_call:
    inputs:
      sha:
        description: Tested main commit to publish when still eligible.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hand-edge-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Check edge candidate
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.check.outputs.eligible }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}
      - name: Check candidate ancestry
        id: check
        env:
          CANDIDATE: ${{ inputs.sha }}
        run: |
          set -eu
          git fetch --force origin main
          set +e
          git ls-remote --exit-code origin refs/tags/edge >/dev/null
          edge_status=$?
          set -e
          case "$edge_status" in
            0) git fetch --force origin refs/tags/edge:refs/tags/edge ;;
            2) ;;
            *) echo "could not determine whether the edge tag exists" >&2; exit 1 ;;
          esac

          if ! git merge-base --is-ancestor "$CANDIDATE" origin/main; then
            echo "candidate $CANDIDATE is not in current main history; skipping" >&2
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git rev-parse --verify refs/tags/edge >/dev/null 2>&1; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          edge=$(git rev-parse refs/tags/edge)
          if [ "$CANDIDATE" = "$edge" ]; then
            echo "candidate already names edge; skipping" >&2
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor "$CANDIDATE" "$edge"; then
            echo "candidate is older than edge; skipping" >&2
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$edge" "$CANDIDATE"; then
            echo "candidate and edge histories diverge; refusing to publish" >&2
            echo "recover by resetting the tag onto current main: git push origin +$CANDIDATE:refs/tags/edge" >&2
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: prepare
    if: needs.prepare.outputs.eligible == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build (unix)
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          CANDIDATE: ${{ inputs.sha }}
        run: |
          set -eu
          version="edge.${CANDIDATE:0:12}"
          go build -ldflags "-s -w -X main.version=${version} -X main.channel=edge -X main.commit=${CANDIDATE}" -o hand .
          if [ "$GOOS" = linux ] && [ "$GOARCH" = amd64 ]; then
            test "$(./hand --version)" = "$version"
          fi
          tar czf "hand-${GOOS}-${GOARCH}.tar.gz" hand
      - name: Build (windows)
        if: matrix.goos == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          CANDIDATE: ${{ inputs.sha }}
        run: |
          set -eu
          version="edge.${CANDIDATE:0:12}"
          go build -ldflags "-s -w -X main.version=${version} -X main.channel=edge -X main.commit=${CANDIDATE}" -o hand.exe .
          zip "hand-${GOOS}-${GOARCH}.zip" hand.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hand-${{ matrix.goos }}-${{ matrix.goarch }}
          path: hand-${{ matrix.goos }}-${{ matrix.goarch }}.*

  publish:
    name: Publish rolling release
    needs: [prepare, build]
    if: needs.prepare.outputs.eligible == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum hand-*.tar.gz hand-*.zip > checksums.txt
      - name: Final ancestry check
        id: final-check
        env:
          CANDIDATE: ${{ inputs.sha }}
        run: |
          set -eu
          git fetch --force origin main
          set +e
          git ls-remote --exit-code origin refs/tags/edge >/dev/null
          edge_status=$?
          set -e
          case "$edge_status" in
            0) git fetch --force origin refs/tags/edge:refs/tags/edge ;;
            2) ;;
            *) echo "could not determine whether the edge tag exists" >&2; exit 1 ;;
          esac

          if ! git merge-base --is-ancestor "$CANDIDATE" origin/main; then
            echo "candidate is no longer in main history; skipping" >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify refs/tags/edge >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          edge=$(git rev-parse refs/tags/edge)
          if [ "$CANDIDATE" = "$edge" ] || git merge-base --is-ancestor "$CANDIDATE" "$edge"; then
            echo "edge advanced past candidate; skipping" >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git merge-base --is-ancestor "$edge" "$CANDIDATE"; then
            echo "candidate and edge histories diverge; refusing to publish" >&2
            echo "recover by resetting the tag onto current main: git push origin +$CANDIDATE:refs/tags/edge" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Create edge release
        if: steps.final-check.outputs.publish == 'true'
        env:
          CANDIDATE: ${{ inputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cat > edge-notes.md <<EOF
          This is the rolling development build for maintainers and contributors.

          Source commit: ${CANDIDATE}
          Channel: edge
          CI status: passed

          This release and its \`edge\` tag are intentionally mutable and are replaced after newer \`main\` commits pass the complete CI gate.

          Not intended as the stable release channel.
          EOF
          assets=(
            hand-linux-amd64.tar.gz
            hand-linux-arm64.tar.gz
            hand-darwin-amd64.tar.gz
            hand-darwin-arm64.tar.gz
            hand-windows-amd64.zip
            checksums.txt
          )
          if ! gh release view edge --repo atqamz/hand >/dev/null 2>&1; then
            # A new draft release may create the edge tag automatically. Existing
            # releases keep their tag until the staged assets are promoted.
            gh release create edge --repo atqamz/hand --target "$CANDIDATE" --title Edge --prerelease --draft --notes-file edge-notes.md
          fi

          release_id=$(gh api repos/atqamz/hand/releases/tags/edge --jq .id)
          asset_id() {
            local name=$1
            gh api --paginate "repos/atqamz/hand/releases/${release_id}/assets?per_page=100" \
              --jq ".[] | select(.name == \"${name}\") | .id" | head -n 1
          }

          staging_assets=()
          for asset in "${assets[@]}"; do
            staging="edge-staging-${CANDIDATE}-${asset}"
            gh release delete-asset edge --repo atqamz/hand "$staging" --yes >/dev/null 2>&1 || true
            cp "$asset" "$staging"
            staging_assets+=("$staging")
          done

          promotion_started=false
          rollback() {
            status=$?
            if [ "$status" -eq 0 ]; then
              return
            fi
            set +e
            if [ "$promotion_started" = true ]; then
              for index in "${!assets[@]}"; do
                final=${assets[$index]}
                staging=${staging_assets[$index]}
                backup=${backup_assets[$index]:-}
                final_asset_id=$(asset_id "$final")
                if [ -n "$final_asset_id" ]; then
                  gh api --method PATCH "repos/atqamz/hand/releases/assets/${final_asset_id}" \
                    -f name="$staging" >/dev/null
                fi
                if [ -n "$backup" ]; then
                  backup_asset_id=$(asset_id "$backup")
                  if [ -n "$backup_asset_id" ]; then
                    gh api --method PATCH "repos/atqamz/hand/releases/assets/${backup_asset_id}" \
                      -f name="$final" >/dev/null
                  fi
                fi
              done
            fi
            for staging in "${staging_assets[@]}"; do
              gh release delete-asset edge --repo atqamz/hand "$staging" --yes >/dev/null 2>&1 || true
            done
            exit "$status"
          }
          trap rollback EXIT

          # Upload under unique names so a failed candidate upload leaves the
          # previous exact-name assets available to edge clients.
          gh release upload edge --repo atqamz/hand "${staging_assets[@]}"
          for staging in "${staging_assets[@]}"; do
            test -n "$(asset_id "$staging")"
          done

          promotion_started=true
          backup_assets=()
          for index in "${!assets[@]}"; do
            final=${assets[$index]}
            backup="edge-previous-${CANDIDATE}-${final}"
            old_asset_id=$(asset_id "$final")
            if [ -n "$old_asset_id" ]; then
              gh release delete-asset edge --repo atqamz/hand "$backup" --yes >/dev/null 2>&1 || true
              gh api --method PATCH "repos/atqamz/hand/releases/assets/${old_asset_id}" \
                -f name="$backup" >/dev/null
              backup_assets+=("$backup")
            else
              backup_assets+=("")
            fi
          done
          for index in "${!assets[@]}"; do
            final=${assets[$index]}
            staging=${staging_assets[$index]}
            staged_asset_id=$(asset_id "$staging")
            test -n "$staged_asset_id"
            gh api --method PATCH "repos/atqamz/hand/releases/assets/${staged_asset_id}" \
              -f name="$final" >/dev/null
          done
          for backup in "${backup_assets[@]}"; do
            if [ -n "$backup" ]; then
              backup_asset_id=$(asset_id "$backup")
              if [ -n "$backup_asset_id" ]; then
                gh api --method DELETE "repos/atqamz/hand/releases/assets/${backup_asset_id}" >/dev/null
              fi
            fi
          done
          trap - EXIT

          # Publishing before the tag moves keeps edge from naming a commit
          # whose complete asset set is not yet available.
          gh release edit edge --repo atqamz/hand --title Edge --prerelease --draft=false --notes-file edge-notes.md
          git tag -f edge "$CANDIDATE"
          git push origin refs/tags/edge --force
