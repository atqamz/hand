name: "[Reuse] E2E Install"

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build and test; the default is the ref that triggered the run.
        type: string
        default: ""
    outputs:
      sha:
        description: The commit that was built and tested.
        value: ${{ jobs.e2e-build.outputs.sha }}

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: "1.63.0"

jobs:
  e2e-build:
    name: "[E2E] Build Dist"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build the artifacts as a release does
        run: sh .github/scripts/e2e-dist.sh dist "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  e2e-install:
    needs: e2e-build
    name: "[E2E (${{ matrix.label }})] Install"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            label: Linux
            os: ubuntu-latest
          - name: macos
            label: MacOS
            os: macos-latest
          - name: windows
            label: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    env:
      E2E_FRESH_LUVUS: ${{ github.event_name == 'schedule' || startsWith(github.ref, 'refs/tags/') || inputs.ref != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.e2e-build.outputs.sha }}
          persist-credentials: false
      - name: Set the paths
        shell: bash
        run: |
          echo "E2E_TMP=$RUNNER_TEMP/hand-e2e" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/hand-e2e/browsers" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-dist
          path: ${{ runner.temp }}/hand-e2e/dist
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hand-e2e/luvus-cache
          key: luvus-${{ runner.os }}-${{ hashFiles('internal/luvus/pin.go') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/hand-e2e/browsers
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}
      - name: Install the installers' way
        timeout-minutes: 10
        run: node .github/e2e/install.mjs
      - name: First run, Board and Companion pairing
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node .github/e2e/first-run.mjs
      - name: Install Playwright
        if: ${{ !cancelled() }}
        shell: bash
        timeout-minutes: 10
        run: |
          set -eu
          mkdir -p "$E2E_TMP/pw"
          cd "$E2E_TMP/pw"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          if [ "$RUNNER_OS" = Linux ]; then
            npx playwright install --with-deps chromium
          else
            npx playwright install chromium
          fi
      - name: Board in a browser
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: node .github/e2e/smoke.mjs
      - name: Upgrade from the last release
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/e2e/upgrade.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: e2e-logs-${{ matrix.name }}
          path: ${{ runner.temp }}/hand-e2e/logs
          retention-days: 3
          if-no-files-found: ignore
