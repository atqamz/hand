name: v19 Interrupt schema probe

on:
  push:
    branches:
      - implementation/v19-step10-interrupt

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Probe locked schema
        run: go test -tags=test -run '^TestProbeCanonicalV19InterruptSchema$' -count=1 ./internal/store
