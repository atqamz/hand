name: Commentlint fix
on:
  pull_request:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: implementation/v19-step9-worktree-remove
      - name: Fix comments
        shell: python
        run: |
          from pathlib import Path
          p = Path('internal/store/v19worktree_remove.go')
          s = p.read_text()
          s = s.replace(
              '// PrepareCanonicalV19WorktreeRemove durably records one prepared native Git\n// remove request plus exact worktree/workspace scope claims. Cleanup may run\n// after semantic ancestors become terminal, but only for an unreleased exact\n// WorktreeBinding with no open dependent SessionBinding.\n',
              '// PrepareCanonicalV19WorktreeRemove records a prepared native Git remove request\n// plus exact worktree/workspace claims. Terminal ancestors are allowed, but the\n// exact WorktreeBinding must be unreleased with no open SessionBinding.\n',
          )
          s = s.replace(
              '// SubmitCanonicalV19WorktreeRemove commits durable mutation authorization for\n// the exact prepared request. The caller must freshly prove native identity,\n// dependency, cleanliness/preservation, and registration preconditions before\n// calling. External mutation may start only after this returns successfully.\n',
              '// SubmitCanonicalV19WorktreeRemove durably authorizes the exact prepared request.\n// The caller must freshly prove native identity, dependency, preservation, and\n// registration preconditions; external mutation may start only after success.\n',
          )
          p.write_text(s)
      - name: Push
        run: |
          gofmt -w internal/store/v19worktree_remove.go
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/store/v19worktree_remove.go
          git diff --cached --quiet || git commit -m 'style(store): satisfy WorktreeRemove commentlint'
          git push origin HEAD:implementation/v19-step9-worktree-remove
