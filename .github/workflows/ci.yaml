name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: GOOS=windows GOARCH=amd64 go vet ./...
      - run: go test -race ./...

  test-macos:
    runs-on: macos-latest
    env:
      TMPDIR: /private/tmp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...

  test-windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: Lint install.ps1
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          $found = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error, Warning
          $found | Format-Table -AutoSize | Out-String | Write-Output
          if ($found) { exit 1 }
      - name: Install Luvus
        shell: bash
        run: |
          set -eu
          version=$(sed -n 's/^const Tested = "\(.*\)"$/\1/p' internal/luvus/pin.go)
          test -n "$version"
          name=luvus-v$version-x86_64-pc-windows-msvc
          base=https://github.com/RizRiyz/luvus/releases/download/v$version
          dir=$(cygpath -u "$RUNNER_TEMP")/luvus
          mkdir "$dir"
          cd "$dir"
          curl -fsSLO "$base/$name.zip"
          curl -fsSLO "$base/$name.sha256"
          sha256sum -c "$name.sha256"
          unzip -q "$name.zip"
          cygpath -w "$dir" >> "$GITHUB_PATH"
      - run: go test -race ./...
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
      - run: go test -race -count=1 -v -run '^TestLive' ./internal/luvus ./internal/cli
        env:
          HAND_LUVUS_IT: "1"
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
      - name: Smoke the installer
        shell: pwsh
        env:
          CGO_ENABLED: "0"
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'release'
          $rel = Join-Path $root 'latest\download'
          New-Item -ItemType Directory -Path $rel | Out-Null
          go build -trimpath -o hand.exe .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $zip = Join-Path $rel 'hand-windows-amd64.zip'
          Compress-Archive -LiteralPath hand.exe -DestinationPath $zip
          Remove-Item hand.exe
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path (Join-Path $rel 'hand-windows-amd64.sha256') -Value "$hash  hand-windows-amd64.zip" -Encoding ascii
            $redirector = Join-Path $env:RUNNER_TEMP 'redirect.py'
            Set-Content -Path $redirector -Encoding ascii -Value @'
          import functools, http.server, sys
          class Handler(http.server.SimpleHTTPRequestHandler):
              def do_GET(self):
                  if self.path.endswith(sys.argv[2]):
                      self.send_response(302)
                      self.send_header('Location', 'http://downloads.invalid' + self.path)
                      self.end_headers()
                  else:
                      super().do_GET()
          http.server.HTTPServer(('127.0.0.1', int(sys.argv[1])), functools.partial(Handler, directory=sys.argv[3])).serve_forever()
          '@
          $staller = Join-Path $env:RUNNER_TEMP 'stall.py'
          Set-Content -Path $staller -Encoding ascii -Value @'
          import http.server, sys, time
          class Handler(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Length', '1000000')
                  self.end_headers()
                  self.wfile.write(b'x' * 1000)
                  self.wfile.flush()
                  time.sleep(600)
          http.server.ThreadingHTTPServer(('127.0.0.1', int(sys.argv[1])), Handler).serve_forever()
          '@
          $server = Start-Process python -ArgumentList '-m', 'http.server', '8787', '--bind', '127.0.0.1', '--directory', $root -PassThru -WindowStyle Hidden
          try {
            $base = 'http://127.0.0.1:8787'
            foreach ($i in 1..30) {
              try { Invoke-WebRequest -UseBasicParsing -Uri "$base/latest/download/hand-windows-amd64.sha256" | Out-Null; break } catch { Start-Sleep -Seconds 1 }
            }
            if ($server.HasExited) { throw 'the local release server did not start' }
            foreach ($shell in 'powershell', 'pwsh') {
              $dir = Join-Path $env:RUNNER_TEMP "Hand Smoke $shell\bin"
              foreach ($i in 1..2) {
                & $shell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Dir $dir -Base $base
                if ($LASTEXITCODE) { throw "$shell: install.ps1 exited with $LASTEXITCODE" }
              }
              if (Get-ChildItem -LiteralPath $dir -Filter '.hand.exe.*.part' -Force) { throw "$shell: install.ps1 left a temporary file behind" }
              $user = [Environment]::GetEnvironmentVariable('Path', 'User').Split(';') | Where-Object { $_.TrimEnd('\') -eq $dir }
              if (@($user).Count -ne 1) { throw "$shell: user PATH holds $(@($user).Count) entries for $dir" }
              Set-Content -Path (Join-Path $rel 'hand-windows-amd64.sha256') -Value "$('0' * 64)  hand-windows-amd64.zip" -Encoding ascii
              $bad = Join-Path $env:RUNNER_TEMP 'Hand Bad\bin'
              & $shell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Dir $bad -Base $base
              if (-not $LASTEXITCODE) { throw "$shell: install.ps1 accepted a wrong checksum" }
              if (Test-Path -LiteralPath (Join-Path $bad 'hand.exe')) { throw "$shell: install.ps1 installed after a checksum mismatch" }
              & $shell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Dir $bad -Base 'http://example.com/releases'
              if (-not $LASTEXITCODE) { throw "$shell: install.ps1 accepted a remote http base" }
              Set-Content -Path (Join-Path $rel 'hand-windows-amd64.sha256') -Value "$hash  hand-windows-amd64.zip" -Encoding ascii
              foreach ($case in @(@('8788', '.zip'), @('8789', '.sha256'))) {
                $redirecting = Start-Process python -ArgumentList $redirector, $case[0], $case[1], $root -PassThru -WindowStyle Hidden
                try {
                  foreach ($i in 1..30) {
                    try { Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$($case[0])/latest/download/hand-windows-amd64.sha256" -MaximumRedirection 0 | Out-Null; break } catch { if ($_.Exception.Response) { break }; Start-Sleep -Seconds 1 }
                  }
                  $refused = & $shell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Dir $bad -Base "http://127.0.0.1:$($case[0])" 2>&1 | Out-String
                  if (-not $LASTEXITCODE) { throw "$shell: install.ps1 followed a redirect to http for $($case[1])" }
                  if ($refused -notmatch 'refusing a redirect to a non-https URL') { throw "$shell: install.ps1 failed for another reason on $($case[1]): $refused" }
                  if (Test-Path -LiteralPath (Join-Path $bad 'hand.exe')) { throw "$shell: install.ps1 installed after a refused redirect" }
                }
                finally {
                  Stop-Process -Id $redirecting.Id -Force
                }
              }
              $stalling = Start-Process python -ArgumentList $staller, '8790' -PassThru -WindowStyle Hidden
              try {
                foreach ($i in 1..30) {
                  try { [Net.Sockets.TcpClient]::new('127.0.0.1', 8790).Close(); break } catch { Start-Sleep -Seconds 1 }
                }
                $clock = [Diagnostics.Stopwatch]::StartNew()
                $stalled = & $shell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -Dir $bad -Base 'http://127.0.0.1:8790' -TimeoutSec 5 2>&1 | Out-String
                if (-not $LASTEXITCODE) { throw "$shell: install.ps1 finished a stalled download" }
                if ($stalled -notmatch 'timed out after 5 seconds') { throw "$shell: install.ps1 failed for another reason on a stalled download: $stalled" }
                if ($clock.Elapsed.TotalSeconds -gt 60) { throw "$shell: install.ps1 took $([int]$clock.Elapsed.TotalSeconds) seconds to give up on a stalled download" }
                if (Test-Path -LiteralPath (Join-Path $bad 'hand.exe')) { throw "$shell: install.ps1 installed after a stalled download" }
              }
              finally {
                Stop-Process -Id $stalling.Id -Force
              }
            }
          }
          finally {
            Stop-Process -Id $server.Id -Force
          }
          Set-Location $dir
          .\hand.exe version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:SECONDHAND_HOME = Join-Path $env:RUNNER_TEMP 'smoke home'
          $fleet = Join-Path $env:RUNNER_TEMP 'smoke fleet'
          New-Item -ItemType Directory -Path $fleet | Out-Null
          Set-Location $fleet
          & "$dir\hand.exe" init
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$dir\hand.exe" orient
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  edge:
    needs: [test, test-macos, test-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: edge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -eu
          base=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/cli/cli.go)
          test -n "$base"
          pkg=github.com/atqamz/hand/internal/cli
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X $pkg.Version=$base -X $pkg.Channel=edge -X $pkg.Commit=$GITHUB_SHA" -o hand .
            tar -czf "hand-$os-$arch.tar.gz" hand
            rm hand
          done
          sha256sum hand-*.tar.gz > checksums.txt
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X $pkg.Version=$base -X $pkg.Channel=edge -X $pkg.Commit=$GITHUB_SHA" -o hand.exe .
          zip -X hand-windows-amd64.zip hand.exe
          rm hand.exe
          sha256sum hand-windows-amd64.zip > hand-windows-amd64.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          old=$(git rev-parse -q --verify 'refs/tags/edge^{commit}' || true)
          if [ -n "$old" ] && [ "$old" != "$GITHUB_SHA" ] && git merge-base --is-ancestor "$GITHUB_SHA" "$old"; then
            echo "edge is already past $GITHUB_SHA"
            exit 0
          fi
          notes="Rolling build of main at ${GITHUB_SHA:0:12}, $(date -u +%Y-%m-%d). Not a release; install with HAND_INSTALL_VERSION=edge."
          if ! gh release view edge >/dev/null 2>&1; then
            git push --force origin "$GITHUB_SHA:refs/tags/edge"
            gh release create edge --prerelease --title Edge --notes "$notes" --verify-tag
          fi
          gh release upload edge hand-linux-amd64.tar.gz hand-linux-arm64.tar.gz hand-darwin-amd64.tar.gz hand-darwin-arm64.tar.gz checksums.txt hand-windows-amd64.zip hand-windows-amd64.sha256 --clobber
          for name in $(gh release view edge --json assets --jq '.assets[].name'); do
            case "$name" in
              hand-linux-amd64.tar.gz | hand-linux-arm64.tar.gz | hand-darwin-amd64.tar.gz | hand-darwin-arm64.tar.gz | checksums.txt | hand-windows-amd64.zip | hand-windows-amd64.sha256) ;;
              *) gh release delete-asset edge "$name" -y ;;
            esac
          done
          git push --force origin "$GITHUB_SHA:refs/tags/edge"
          gh release edit edge --prerelease --title Edge --notes "$notes"
