name: CI

on:
  push:
    branches: [main]
    paths: &paths
      - core/**
      - src-tauri/**
      - web/**
      - fastlane/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/**
      - .github/scripts/**
      - .github/dependabot.yml
  pull_request:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  TAURI_CLI_VERSION: "2.12.4"
  DEBUG_KEY_SHA256: 083a53cf027c8b4ccc94a0ea3894174ffcf8726b0c49d6b3728dc298fbabd6da
  HAND_SHA: a1e6d07d4f69653c080414f9b01ac8ed6ad0c335

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: actionlint

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install the NDK
        run: sdkmanager --install "ndk;$NDK_VERSION"
      - name: Install the desktop web view libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-linux-android
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: check-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: check-
      - name: Build the pinned hand-iroh sidecar
        run: |
          git init "$RUNNER_TEMP/hand"
          git -C "$RUNNER_TEMP/hand" remote add origin https://github.com/atqamz/hand.git
          git -C "$RUNNER_TEMP/hand" fetch --depth=1 origin "$HAND_SHA"
          git -C "$RUNNER_TEMP/hand" checkout --detach FETCH_HEAD
          cargo build --locked --manifest-path "$RUNNER_TEMP/hand/iroh/Cargo.toml" --bin hand-iroh
          echo "HAND_IROH_BIN=$RUNNER_TEMP/hand/iroh/target/debug/hand-iroh" >> "$GITHUB_ENV"
      - run: .github/scripts/check-store-metadata.sh
      - run: cargo fmt --all --check
      - run: cargo test --locked --workspace
      - name: Test the web view scripts
        run: node --test "src-tauri/tests/*.test.mjs"
      - name: Clippy for Android
        run: |
          toolchain="$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$toolchain/aarch64-linux-android24-clang"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android24-clang"
          cargo clippy --locked --workspace --all-targets --target aarch64-linux-android -- -D warnings

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install the Android SDK packages
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION"
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add aarch64-linux-android
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-tauri
            ~/.gradle/caches
            ~/.gradle/wrapper
            target
            src-tauri/gen/android/.gradle
            src-tauri/gen/android/app/build
          key: apk-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}-${{ env.TAURI_CLI_VERSION }}
          restore-keys: apk-
      - name: Install tauri-cli
        run: |
          if ! cargo tauri --version 2>/dev/null | grep -qx "tauri-cli $TAURI_CLI_VERSION"; then
            cargo install tauri-cli --version "$TAURI_CLI_VERSION" --locked
          fi
      - name: Build the debug APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          cargo tauri android build --debug --apk --target aarch64
      - name: Run the JVM tests and check the screen images
        run: ./gradlew :app:verifyPaparazziUniversalDebug
        working-directory: src-tauri/gen/android
      - name: Check the APK's signer
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs"
          grep -qx "Signer #1 certificate SHA-256 digest: $DEBUG_KEY_SHA256" "$RUNNER_TEMP/certs"
          test "$(grep -c "^Signer #.* certificate SHA-256 digest:" "$RUNNER_TEMP/certs")" -eq 1
      - name: Build the unsigned release APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          cargo tauri android build --apk --target aarch64
      - name: Check that R8 kept what Rust calls
        run: .github/scripts/check-jni-keep.sh src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hand-android-debug-apk
          path: src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
          retention-days: 14
