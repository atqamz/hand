name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Lets the self-heal workflow (vendorhash-selfheal.yaml) re-run CI on a Dependabot
  # branch after it pushes a corrected vendorHash: a GITHUB_TOKEN push does not start a
  # new run on its own, so that workflow dispatches one explicitly.
  workflow_dispatch:
    inputs:
      run_expensive_mutation:
        description: Run non-blocking store and runtime mutation evidence.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  native-bootstrap:
    if: github.event_name != 'pull_request' || github.head_ref == 'release-please--branches--main'
    name: Native canonical bootstrap (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Exercise untagged CLI with locked runtime artifacts
        run: go test -tags=nativebootstrap -count=1 -v -timeout=10m ./tests/e2e

  mutation:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main')
    name: Mutation (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/shellquote
            name: shellquote
            flags: ""
          - package: ./internal/age
            name: age
            flags: ""
          - package: ./internal/axi
            name: axi
            flags: ""
          - package: ./internal/completion
            name: completion
            flags: --timeout-coefficient=100
          - package: ./internal/registry
            name: registry
            flags: --workers=4 --test-cpu=1 --timeout-coefficient=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Run exact mutation gate
        run: |
          mkdir -p mutation-results
          make mutation-gate PKG="${{ matrix.package }}" RESULTS="mutation-results/results.json" GREMLINS_FLAGS="${{ matrix.flags }}"
      - name: Summarize mutation evidence
        if: always()
        run: |
          {
            echo "source: $(git rev-parse HEAD)"
            echo "tool: github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0"
            echo "tags: test"
            echo "package: ${{ matrix.package }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if test -s mutation-results/results.json; then
            jq -c '{go_module, mutants_total, mutants_killed, mutants_lived, mutants_not_covered, elapsed_time}' mutation-results/results.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Mutation evidence was missing or incomplete.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-${{ matrix.name }}
          path: mutation-results/results.json
          if-no-files-found: warn
          retention-days: 14

  mutation-expensive-manual:
    if: inputs.run_expensive_mutation
    uses: ./.github/workflows/mutation-expensive.yaml

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: |
          output=$(gofmt -l .)
          if [ -n "$output" ]; then
            echo "Files not formatted:"
            echo "$output"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # A full major.minor.patch pin resolves locally; "latest" makes the
          # action fetch a remote version mapping that fails the job on any
          # network blip. Keep in sync with nixpkgs' golangci-lint in flake.nix.
          version: v2.12.2
      - name: Comments
        run: go run ./tools/commentlint .

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name != 'pull_request' || github.head_ref == 'release-please--branches--main') && '["ubuntu-latest","ubuntu-24.04-arm","macos-latest","macos-15-intel","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Pin npm
        # Keep in sync with the same pin in .github/workflows/release.yaml.
        run: npm install -g npm@12.0.2
      - name: Test
        run: go test -tags=test -race -timeout=45m ./...
      - name: Build
        run: go build -o hand .

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: End-to-end
        run: go test -tags=e2e,test -timeout=10m ./tests/e2e/...

  e2e-windows:
    name: E2E (windows-latest, bootstrap.ps1)
    if: github.event_name != 'pull_request' || github.head_ref == 'release-please--branches--main'
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: End-to-end (bootstrap.ps1)
        run: go test '-tags=e2e,test' -timeout=10m -run "^(TestBootstrapPS1|TestBackgroundJob)" ./tests/e2e/...

  e2e-macos:
    name: E2E (macos-latest, bootstrap.sh)
    if: github.event_name != 'pull_request' || github.head_ref == 'release-please--branches--main'
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: End-to-end (bootstrap.sh)
        run: go test -tags=e2e,test -timeout=10m -run "^(TestBootstrap|TestBackgroundTimeoutStopsDescendantBeforeTempRemoval)" ./tests/e2e/...

  e2e-macos-intel:
    name: E2E (macos-15-intel, bootstrap.sh)
    if: github.event_name != 'pull_request' || github.head_ref == 'release-please--branches--main'
    runs-on: macos-15-intel
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: End-to-end (bootstrap.sh)
        run: go test -tags=e2e,test -timeout=10m -run "^(TestBootstrap|TestBackgroundTimeoutStopsDescendantBeforeTempRemoval)" ./tests/e2e/...

  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Contract
        run: make contract

  nix-build:
    if: github.event_name != 'pull_request' || github.head_ref == 'release-please--branches--main' || github.event.pull_request.user.login == 'dependabot[bot]'
    name: Nix build (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Build flake package
        run: nix build .#default --no-link --print-out-paths
      - name: Diagnose stale vendorHash
        if: failure()
        # go.mod/go.sum changes invalidate vendorHash but nothing keeps them in sync;
        # Dependabot doesn't know flake.nix exists. Recompute and name the fix instead
        # of leaving the raw Nix hash-mismatch trace as the only signal.
        run: |
          if make vendorhash; then
            if git diff --quiet flake.nix; then
              echo "::notice::flake.nix's vendorHash already matches go.mod/go.sum; the failure above is unrelated to vendoring."
            else
              hash=$(grep -oP '(?<=vendorHash = ")[^"]+' flake.nix)
              echo "::error file=flake.nix::vendorHash is stale for the current go.mod/go.sum. Run 'make vendorhash' locally and commit the result, or set vendorHash = \"$hash\" directly."
            fi
          else
            echo "::warning::could not determine whether vendorHash is stale; see the 'Build flake package' failure above."
          fi
      - name: Hand the fix to the privileged self-heal workflow
        if: failure() && github.event.pull_request.user.login == 'dependabot[bot]'
        # This job's token is read-only on a Dependabot pull_request run regardless of any
        # permissions: block, and it is the only job that fetches or builds dependency code
        # the PR controls. It hands off just a hash string; vendorhash-selfheal.yaml, which
        # has write access, never runs go, nix, or make.
        run: |
          if git diff --quiet flake.nix; then
            echo "vendorHash is already correct; nothing to hand off."
            exit 0
          fi
          hash=$(grep -oP '(?<=vendorHash = ")[^"]+' flake.nix)
          if ! [[ "$hash" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]; then
            echo "::error::computed vendorHash '$hash' is not a well-formed SRI hash; refusing to hand it off." >&2
            exit 1
          fi
          if ! nix build .#default --no-link; then
            echo "::error::flake.nix with the recomputed vendorHash still does not build; refusing to hand it off." >&2
            exit 1
          fi
          mkdir -p /tmp/vendorhash-fix
          printf '%s' "$hash" > /tmp/vendorhash-fix/vendorhash.txt
      - uses: actions/upload-artifact@v7
        if: failure() && github.event.pull_request.user.login == 'dependabot[bot]'
        with:
          name: vendorhash-fix
          path: /tmp/vendorhash-fix/vendorhash.txt
          if-no-files-found: ignore
          retention-days: 1
      - name: Run built binary
        run: '"$(nix build .#default --no-link --print-out-paths)/bin/hand" --version'
