name: Provider authority scratch inputs

on:
  push:
    branches: [scratch/provider-authority-20260923]
    paths: [.github/workflows/provider-authority-scratch.yaml]

permissions:
  contents: read

jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch exact public source snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          for item in 'herdrdev/herdr 23479dd162caba32379d405b8c8107ff2ae8dbaf herdr' 'atqamz/hand c15cbd3d444ef47e8f9cd4321314c6310a59e2b8 hand'; do
            read -r repo sha name <<< "$item"
            git init "$name"
            git -C "$name" fetch --depth=1 "https://github.com/$repo.git" "$sha"
            git -C "$name" checkout --detach FETCH_HEAD
            test "$(git -C "$name" rev-parse HEAD)" = "$sha"
            git -C "$name" archive --format=tar HEAD | gzip -n > "bundle/$name-source.tar.gz"
            git -C "$name" rev-parse HEAD HEAD^{tree} > "bundle/$name-revisions.txt"
          done
      - name: Prepare isolated Rust compiler and dependency cache
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_HOME="$RUNNER_TEMP/provider-rustup"
          export CARGO_HOME="$RUNNER_TEMP/provider-cargo"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          sysroot="$(rustup run 1.98.1 rustc --print sysroot)"
          rustup run 1.98.1 rustc -vV > bundle/rust-version.txt
          tar -C "$sysroot" -cJf bundle/rust-toolchain.tar.xz bin lib
          cd herdr
          rustup run 1.98.1 cargo fetch --locked --target x86_64-unknown-linux-gnu
          cd ..
          tar -C "$CARGO_HOME" -czf bundle/cargo-registry.tar.gz registry
          sha256sum bundle/* > bundle/SHA256SUMS
      - name: Upload disposable review inputs
        uses: actions/upload-artifact@v7
        with:
          name: provider-authority-review-inputs
          path: bundle/
          retention-days: 1
          compression-level: 0
