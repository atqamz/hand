name: Release guard

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the latest release is a Hand release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name || true)
          test -n "$latest" || { echo "the repository has no latest release" >&2; exit 1; }
          case "$latest" in
            v[0-9]*) echo "the latest release is $latest" ;;
            *)
              echo "the latest release is $latest, not a Hand release: hand update would fetch it" >&2
              exit 1
              ;;
          esac
