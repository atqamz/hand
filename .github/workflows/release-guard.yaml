name: Release guard

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check that the latest release is a Hand release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>"$RUNNER_TEMP/latest.err"); then
            :
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/latest.err"; then
            echo "the repository has no latest release; nothing to guard"
            exit 0
          else
            cat "$RUNNER_TEMP/latest.err" >&2
            exit 1
          fi
          test -n "$latest" || { echo "the latest release has no tag" >&2; exit 1; }
          case "$latest" in
            v[0-9]*) echo "the latest release is $latest" ;;
            *)
              echo "the latest release is $latest, not a Hand release: hand update would fetch it" >&2
              exit 1
              ;;
          esac
