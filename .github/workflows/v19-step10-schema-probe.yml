name: v19 step10 schema probe

on:
  pull_request:
    branches: [main]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -tags=test ./internal/store -run TestCanonicalV19Step10SchemaProbe -count=1 -v
