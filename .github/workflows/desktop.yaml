name: "[Reuse] Desktop"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  desktop-smoke:
    name: "[Companion (${{ matrix.label }})] Build"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            label: Linux
          - name: macos
            os: macos-latest
            label: MacOS
          - name: windows
            os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Reserve the Windows exception stack (golang/go#81238)
        if: runner.os == 'Windows'
        run: sh .github/scripts/windows-stack-reserve.sh
      - name: Test the window headless
        run: go test ./internal/desktop ./cmd/hand-desktop
      - name: Check the committed scene images against fresh renders
        if: runner.os == 'Linux'
        env:
          SCENES_OUT: ${{ runner.temp }}/scenes
        run: sh .github/desktop/check-scenes.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() && runner.os == 'Linux' }}
        with:
          name: scenes-render
          path: ${{ runner.temp }}/scenes
      - name: Vet the window with mygo
        run: |
          go mod download
          export GOFLAGS=-mod=readonly GOPROXY=off
          status=0
          for pkg in ./internal/desktop ./cmd/hand-desktop; do
            out=$(go run github.com/egoist/mygo/cmd/mygo vet "$pkg" 2>&1) || status=1
            if [ -n "$out" ]; then
              printf '%s\n' "$out"
              status=1
            fi
          done
          exit $status
      - name: Build cgo-free and check the stamp it reports
        run: sh .github/desktop/smoke.sh

  desktop-window:
    name: "[Companion (${{ matrix.label }})] Window"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            label: Linux
          - name: macos
            os: macos-latest
            label: MacOS
          - name: windows
            os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Reserve the Windows exception stack (golang/go#81238)
        if: runner.os == 'Windows'
        run: sh .github/scripts/windows-stack-reserve.sh
      - name: Install GTK, WebKitGTK, a virtual display and Mesa
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl-mesa0 x11-utils xdotool dbus libwebkit2gtk-4.1-0 imagemagick
      - name: Set the output folder
        run: echo "HAND_WINDOW_OUT=$RUNNER_TEMP/hand-window" >> "$GITHUB_ENV"
      - name: Open the window, read its elements, capture it and quit
        run: |
          set -eu
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" go test -tags e2e ./cmd/hand-desktop -run '^TestRealWindow$' -count=1 -v
          else
            go test -tags e2e ./cmd/hand-desktop -run '^TestRealWindow$' -count=1 -v
          fi
          test -s "$HAND_WINDOW_OUT/window.png"
      - name: Blur the window, raise a need, read its title, urgency hint and launcher count, focus it
        if: runner.os == 'Linux'
        run: |
          set -eu
          xvfb-run -a -s "-screen 0 1600x1000x24" go test -tags e2e ./cmd/hand-desktop -run '^TestRealWindowAttention$' -count=1 -v
          test -s "$HAND_WINDOW_OUT/attention/window.png"
      - name: Open a PDF in the web view and check that it is drawn across it
        if: runner.os == 'Linux'
        run: |
          set -eu
          xvfb-run -a -s "-screen 0 1600x1000x24" go test -tags e2e ./cmd/hand-desktop -run '^TestRealWindowPDF$' -count=1 -v
          test -s "$HAND_WINDOW_OUT/pdf/window.png"
      - name: Load a hostile HTML page in the web view and check that it sends no request outside the Board's origin and that a click or Tab and Return on an ordinary link opens no connection
        if: runner.os == 'Linux'
        run: |
          set -eu
          xvfb-run -a -s "-screen 0 1600x1000x24" go test -tags e2e ./cmd/hand-desktop -run '^TestRealWebView' -count=1 -v
      - name: Make a fleet from the New fleet form with real hand init and board start, then stop the Board
        run: |
          set -eu
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" go test -tags e2e ./cmd/hand-desktop -run '^TestRealWindowNewFleet$' -count=1 -v
          else
            go test -tags e2e ./cmd/hand-desktop -run '^TestRealWindowNewFleet$' -count=1 -v
          fi
          test -s "$HAND_WINDOW_OUT/newfleet/window.png"
      - name: Build Hand.app with hand update from a fake release, open the window from it and quit
        if: runner.os == 'macOS'
        run: |
          set -eu
          go test -tags e2e ./cmd/hand-desktop -run '^TestRealWindowFromBundle$' -count=1 -v
          test -s "$HAND_WINDOW_OUT/bundle/window.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: window-${{ matrix.name }}
          path: ${{ runner.temp }}/hand-window
          retention-days: 14
          if-no-files-found: ignore

  desktop-assets:
    name: "[Companion (Desktop)] Assets"
    needs: desktop-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build the release assets
        run: |
          set -eu
          version=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/cli/cli.go)
          test -n "$version"
          out=$RUNNER_TEMP/desktop
          sh .github/scripts/build-desktop.sh "$version" stable "$GITHUB_SHA" "$out"
          sh .github/desktop/check-assets.sh "$out"
          ls -l "$out"
      - name: Check the Windows asset carries its channel
        run: sh .github/desktop/check-stamp.sh
