name: Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - internal/desktop/**
      - internal/desktopasset/**
      - internal/launcher/**
      - internal/update/**
      - internal/board/**
      - cmd/hand-desktop/**
      - internal/cli/cli.go
      - internal/buildstamp/**
      - .github/desktop/**
      - .github/scripts/build-desktop.sh
      - .github/workflows/desktop.yaml
      - go.mod
      - go.sum

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  smoke:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Reserve the Windows exception stack (golang/go#81238)
        if: runner.os == 'Windows'
        run: sh .github/scripts/windows-stack-reserve.sh
      - name: Test the window headless
        run: go test ./internal/desktop ./cmd/hand-desktop
      - name: Vet the window with mygo
        run: |
          go mod download
          export GOFLAGS=-mod=readonly GOPROXY=off
          status=0
          for pkg in ./internal/desktop ./cmd/hand-desktop; do
            out=$(go run github.com/egoist/mygo/cmd/mygo vet "$pkg" 2>&1) || status=1
            if [ -n "$out" ]; then
              printf '%s\n' "$out"
              status=1
            fi
          done
          exit $status
      - name: Build cgo-free and check the stamp it reports
        run: sh .github/desktop/smoke.sh

  window:
    name: window ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-latest
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Reserve the Windows exception stack (golang/go#81238)
        if: runner.os == 'Windows'
        run: sh .github/scripts/windows-stack-reserve.sh
      - name: Install GTK, a virtual display and Mesa
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl-mesa0
      - name: Set the output folder
        run: echo "HAND_WINDOW_OUT=$RUNNER_TEMP/hand-window" >> "$GITHUB_ENV"
      - name: Open the window, read its elements, capture it and quit
        run: |
          set -eu
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" go test -tags e2e ./cmd/hand-desktop -run '^TestRealWindow$' -count=1 -v
          else
            go test -tags e2e ./cmd/hand-desktop -run '^TestRealWindow$' -count=1 -v
          fi
          test -s "$HAND_WINDOW_OUT/window.png"
      - name: Make a fleet from the New fleet form with real hand init and board start, then stop the Board
        run: |
          set -eu
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1600x1000x24" go test -tags e2e ./cmd/hand-desktop -run '^TestRealWindowNewFleet$' -count=1 -v
          else
            go test -tags e2e ./cmd/hand-desktop -run '^TestRealWindowNewFleet$' -count=1 -v
          fi
          test -s "$HAND_WINDOW_OUT/newfleet/window.png"
      - name: Build Hand.app with hand update from a fake release, open the window from it and quit
        if: runner.os == 'macOS'
        run: |
          set -eu
          go test -tags e2e ./cmd/hand-desktop -run '^TestRealWindowFromBundle$' -count=1 -v
          test -s "$HAND_WINDOW_OUT/bundle/window.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: window-${{ matrix.name }}
          path: ${{ runner.temp }}/hand-window
          retention-days: 14
          if-no-files-found: ignore

  assets:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build the release assets
        run: |
          set -eu
          version=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' internal/cli/cli.go)
          test -n "$version"
          out=$RUNNER_TEMP/desktop
          sh .github/scripts/build-desktop.sh "$version" stable "$GITHUB_SHA" "$out"
          sh .github/desktop/check-assets.sh "$out"
          ls -l "$out"
      - name: Check the Windows asset carries its channel
        run: sh .github/desktop/check-stamp.sh
