name: Chat runtime integration review

on:
  push:
    branches: [review/chat-20260921]
    paths: [.github/workflows/chat-review-runtime.yml]

permissions:
  contents: write

jobs:
  verify-590:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7b3e9f8db7a27cf7fe7896b2b1c84b890d67a4dc
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g npm@12.0.2
      - name: Integrate reviewed Git candidate and main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c manual-review-590
          git merge --no-ff --no-edit 23ccf3c8dd05670c8282895cec8a5e44e11e1c13
      - name: Add previous-generation regression
        shell: python
        run: |
          from pathlib import Path
          Path('internal/herdr/lifecycle_generation_test.go').write_text(r'''package herdr

          import (
              "bytes"
              "context"
              "errors"
              "os"
              "path/filepath"
              "testing"

              "github.com/atqamz/hand/internal/toolchain"
          )

          func TestFleetHerdrEnsurePreservesPreviousHandGeneration(t *testing.T) {
              setFleetHerdrHome(t)
              ctx := context.Background()
              store := managedServerLeaseStore(t)
              if _, err := store.Ensure(ctx, "", ""); err != nil { t.Fatal(err) }
              generation, err := store.GenerationID("", "")
              if err != nil { t.Fatal(err) }
              source := filepath.Join(t.TempDir(), managedExecutableName("hand"))
              if err := os.WriteFile(source, []byte("previous Hand generation"), 0o700); err != nil { t.Fatal(err) }
              previous, err := store.MaterializeHandExecutable(source)
              if err != nil { t.Fatal(err) }
              const fleetID = "f_0123456789abcdef0123456789abcdef"
              session := SessionName(fleetID)
              runtimeRequest := toolchain.LeaseRequest{
                  Generation: generation, LeaseID: "herdr-server:"+session, FleetID: fleetID,
                  Consumer: "herdr-server", Evidence: "session="+session,
              }
              runtimeLease, err := store.AcquireLease(runtimeRequest)
              if err != nil { t.Fatal(err) }
              t.Cleanup(func() { _ = runtimeLease.Close() })
              handRequest := toolchain.LeaseRequest{
                  Generation: "sha256:"+filepath.Base(filepath.Dir(previous)), LeaseID: "herdr-guardian:"+session,
                  FleetID: fleetID, Consumer: "runtime-guardian", Evidence: "session="+session,
              }
              handLease, err := store.AcquireHandLease(handRequest)
              if err != nil { t.Fatal(err) }
              t.Cleanup(func() { _ = handLease.Close() })
              before := map[string][]byte{}
              for _, path := range []string{runtimeLease.RecordPath(), handLease.RecordPath()} {
                  before[path], err = os.ReadFile(path)
                  if err != nil { t.Fatal(err) }
              }
              if err := os.WriteFile(source, []byte("current Hand generation"), 0o700); err != nil { t.Fatal(err) }
              current, err := store.MaterializeHandExecutable(source)
              if err != nil { t.Fatal(err) }
              client := &Client{store: store, guardian: current, runtimeGeneration: generation, fleetID: fleetID, session: session}
              if owned, err := client.serverLeaseOwned(ctx); err != nil || owned {
                  t.Fatalf("caller-generation ownership = %t, %v; want false with the previous guardian still leased", owned, err)
              }
              starts := 0
              h := testFleetHerdr(func(context.Context) SessionObservation {
                  return SessionObservation{Name: session, State: SessionRunningCompatible}
              }, func(context.Context) error { starts++; return nil }, nil)
              h.ownershipFn = client.serverLeaseOwned
              if err := h.Ensure(ctx); !errors.Is(err, ErrSessionUnowned) {
                  t.Fatalf("running previous generation was not refused without restart: %v", err)
              }
              if starts != 0 { t.Fatalf("started %d replacement servers", starts) }
              if held, err := store.RuntimeLeaseHeld(runtimeRequest); err != nil || !held { t.Fatalf("previous runtime lease = %t, %v", held, err) }
              if held, err := store.HandLeaseHeld(handRequest); err != nil || !held { t.Fatalf("previous Hand lease = %t, %v", held, err) }
              for path, want := range before {
                  got, err := os.ReadFile(path)
                  if err != nil || !bytes.Equal(got, want) { t.Fatalf("previous ownership metadata changed: %s: %v", path, err) }
              }
          }
          ''')
      - name: Prove previous-generation RED
        shell: bash
        run: |
          gofmt -w internal/herdr/lifecycle_generation_test.go
          set +e
          go test -tags=test -run '^TestFleetHerdrEnsurePreservesPreviousHandGeneration$' -count=1 ./internal/herdr > /tmp/590-red.log 2>&1
          result=$?
          set -e
          cat /tmp/590-red.log
          test "$result" -ne 0
          grep -q 'running previous generation was not refused without restart' /tmp/590-red.log
      - name: Remove automatic destructive restart and dead stop helpers
        shell: python
        run: |
          from pathlib import Path
          import re
          path = Path('internal/herdr/lifecycle.go')
          text = path.read_text()
          old = '''\t\tif err := f.stop(ctx); err != nil {
          \t\t\treturn sessionEnsureError(observation, fmt.Errorf("stop unowned Fleet Herdr session: %w", err))
          \t\t}
          \t\tif err := f.waitStopped(ctx); err != nil {
          \t\t\treturn err
          \t\t}
          \t\treturn f.startAndWait(ctx)'''
          assert text.count(old) == 1
          text = text.replace(old, '''\t\t// Missing leases for this caller do not authorize stopping a live
          \t\t// session, which may still belong to an earlier Hand generation.
          \t\treturn sessionEnsureError(observation, ErrSessionUnowned)''')
          for name in ['waitStopped', 'stop']:
              pattern = r'^func \(f \*FleetHerdr\) '+name+r'\(.*?^}\n\n'
              text, count = re.subn(pattern, '', text, flags=re.M|re.S)
              assert count == 1, (name, count)
          text, count = re.subn(r'^\tstopFn\s+func\(context.Context\) error\n', '', text, flags=re.M)
          assert count == 1
          path.write_text(text)
          path = Path('internal/herdr/client.go')
          text, count = re.subn(r'^func \(c \*Client\) stopServer\(.*?^}\n\n', '', path.read_text(), flags=re.M|re.S)
          assert count == 1
          path.write_text(text)
          path = Path('internal/herdr/lifecycle_test.go')
          text = path.read_text()
          replacement = '''func TestFleetHerdrEnsureRefusesRunningSessionWithoutGuardianLeases(t *testing.T) {
          \tsetFleetHerdrHome(t)
          \tvar starts atomic.Int32
          \th := testFleetHerdr(func(context.Context) SessionObservation {
          \t\treturn SessionObservation{Name: "hand-f_test", State: SessionRunningCompatible}
          \t}, func(context.Context) error { starts.Add(1); return nil }, nil)
          \th.ownershipFn = func(context.Context) (bool, error) { return false, nil }
          \tif err := h.Ensure(context.Background()); !errors.Is(err, ErrSessionUnowned) {
          \t\tt.Fatalf("Ensure() = %v, want ErrSessionUnowned", err)
          \t}
          \tif starts.Load() != 0 { t.Fatal("Ensure restarted a running unowned session") }
          }

          '''
          text, count = re.subn(r'^func TestFleetHerdrEnsureRestartsRunningSessionWithoutGuardianLeases\(.*?^}\n\n', lambda _: replacement, text, flags=re.M|re.S)
          assert count == 1
          text, count = re.subn(r'^\th.stopFn = func\(context.Context\) error \{\n.*?^\t}\n', '', text, flags=re.M|re.S)
          assert count == 2
          assert text.count('\tvar stops atomic.Int32\n') == 2
          text = text.replace('\tvar stops atomic.Int32\n', '')
          old = '''\tif stops.Load() != 0 || starts.Load() != 0 {
          \t\tt.Fatalf("unknown proof stop/start calls = %d/%d, want 0/0", stops.Load(), starts.Load())
          \t}'''
          assert text.count(old) == 1
          text = text.replace(old, '''\tif starts.Load() != 0 {
          \t\tt.Fatalf("unknown proof start calls = %d, want zero", starts.Load())
          \t}''')
          old = '''\tif got := stops.Load(); got != 0 {
          \t\tt.Fatalf("stop calls = %d, want zero", got)
          \t}'''
          assert text.count(old) == 1
          text = text.replace(old, '')
          path.write_text(text)
      - name: Prove cross-PR E2E fixture RED
        shell: bash
        run: |
          gofmt -w internal/herdr/lifecycle.go internal/herdr/client.go internal/herdr/lifecycle_test.go
          set +e
          go test -tags=e2e,test -run '^TestProjectAddNormalizesEffectiveHTTPSWithoutHelper$' -count=1 -timeout=10m ./tests/e2e > /tmp/590-e2e-red.log 2>&1
          result=$?
          set -e
          cat /tmp/590-e2e-red.log
          test "$result" -ne 0
          grep -q 'no such file or directory' /tmp/590-e2e-red.log
          grep -q 'project_test.go' /tmp/590-e2e-red.log
      - name: Resolve E2E helpers through the real deterministic generation
        shell: python
        run: |
          from pathlib import Path
          path = Path('tests/e2e/project_test.go')
          text = path.read_text()
          old = '''\tlock, err := toolchain.LoadLock()
          \tif err != nil {
          \t\tt.Fatal(err)
          \t}
          '''
          assert text.count(old) == 5
          text = text.replace(old, '')
          text = text.replace('filepath.Join(home, ".secondhand", "runtime", "bundles", lock.RuntimeID)', 'seededRuntimeBundle(t, home)')
          text = text.replace('filepath.Join(home, ".secondhand", "runtime", "bundles", lock.RuntimeID, ', 'filepath.Join(seededRuntimeBundle(t, home), ')
          assert 'lock.RuntimeID' not in text
          text += '''
          func seededRuntimeBundle(t *testing.T, home string) string {
          \tt.Helper()
          \tlock, err := toolchain.LoadLock()
          \tif err != nil { t.Fatal(err) }
          \troot := filepath.Join(home, ".secondhand")
          \tstore, err := toolchain.NewStore(root, lock)
          \tif err != nil { t.Fatal(err) }
          \tgeneration, err := store.GenerationID("", "")
          \tif err != nil { t.Fatal(err) }
          \treturn filepath.Join(root, "runtime", "bundles", generation)
          }
          '''
          path.write_text(text)
      - name: Verify integrated production packages and E2E
        shell: bash
        run: |
          gofmt -w tests/e2e/project_test.go
          git diff --check
          go test -tags=test -race -run '^TestFleetHerdrEnsurePreservesPreviousHandGeneration$' -count=20 ./internal/herdr
          go test -tags=test -race -timeout=20m ./cmd ./internal/herdr ./internal/toolchain ./internal/supervision ./internal/integration
          go test -tags=e2e,test -count=1 -timeout=15m ./tests/e2e
          go vet -tags=test ./cmd ./internal/herdr ./internal/toolchain ./internal/supervision ./internal/integration
          make contract
      - name: Publish verified candidate branch only
        run: |
          git add internal/herdr/lifecycle.go internal/herdr/client.go internal/herdr/lifecycle_test.go internal/herdr/lifecycle_generation_test.go tests/e2e/project_test.go
          git commit -m 'fix(herdr): preserve live sessions without exact guardian ownership' -m 'Refuse rather than stop a running session merely because this Hand generation cannot prove its guardian leases. Remove dead restart helpers and cover an actually leased previous Hand generation. Resolve integration fixtures through the deterministic generation shared with the Git transport change.' -m 'Refs #519'
          git push origin HEAD:refs/heads/review/prepared-590-20260921
          echo "CANDIDATE_590=$(git rev-parse HEAD)"
