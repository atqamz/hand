name: Main APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the version, versionCode and pinned key
        run: |
          config=src-tauri/tauri.conf.json
          version="$(jq -r .version "$config")"
          [[ $version =~ ^(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$ ]]
          IFS=. read -r major minor patch <<<"$version"
          test "$minor" -lt 1000
          test "$patch" -lt 1000
          test "$major" -lt 2100
          expected=$((major * 1000000 + minor * 1000 + patch))
          version_code="$(jq -r .bundle.android.versionCode "$config")"
          test "$version_code" -eq "$expected"
          [[ "$(cat release-key.sha256)" =~ ^[0-9a-f]{64}$ ]]
          echo "versionName $version, versionCode $version_code, expected $expected"
      - uses: ./.github/actions/build-signed-apk
        id: build
        with:
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      - name: Check the APK
        run: |
          apk="${{ steps.build.outputs.path }}"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          config=src-tauri/tauri.conf.json
          test "$("$apkanalyzer" manifest version-name "$apk")" = "$(jq -r .version "$config")"
          test "$("$apkanalyzer" manifest version-code "$apk")" = "$(jq -r .bundle.android.versionCode "$config")"
          .github/scripts/check-jni-keep.sh "$apk"
      - name: Report the APK
        run: |
          apk="${{ steps.build.outputs.path }}"
          apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          version_name="$("$apkanalyzer" manifest version-name "$apk")"
          version_code="$("$apkanalyzer" manifest version-code "$apk")"
          sha256="$(sha256sum "$apk" | cut -d' ' -f1)"
          { echo "versionName $version_name"; echo "versionCode $version_code"; echo "sha256 $sha256"; } | tee -a "$GITHUB_STEP_SUMMARY"
          mv "$apk" "$RUNNER_TEMP/hand-android-main.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hand-android-main-apk
          path: ${{ runner.temp }}/hand-android-main.apk
          if-no-files-found: error
          retention-days: 7
