name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build (unix)
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          commit='${{ needs.release-please.outputs.sha }}'
          test "$(git rev-parse HEAD)" = "$commit"
          go build -ldflags "-s -w -X main.version=${{ needs.release-please.outputs.version }} -X main.channel=stable -X main.commit=${commit} -X main.distribution=github" -o hand .
          host_goos=$(go env GOHOSTOS)
          host_goarch=$(go env GOHOSTARCH)
          if [ "$host_goos/$host_goarch" = "${{ matrix.goos }}/${{ matrix.goarch }}" ]; then
            ./hand build-info | grep -Fx "version: ${{ needs.release-please.outputs.version }}"
            ./hand build-info | grep -Fx "channel: stable"
            ./hand build-info | grep -Fx "commit: ${commit}"
            ./hand build-info | grep -Fx "distribution: github"
          fi
          tar czf hand-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz hand
      - name: Build (windows)
        if: matrix.goos == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          commit='${{ needs.release-please.outputs.sha }}'
          test "$(git rev-parse HEAD)" = "$commit"
          go build -ldflags "-s -w -X main.version=${{ needs.release-please.outputs.version }} -X main.channel=stable -X main.commit=${commit} -X main.distribution=github" -o hand.exe .
          zip hand-${{ matrix.goos }}-${{ matrix.goarch }}.zip hand.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hand-${{ matrix.goos }}-${{ matrix.goarch }}
          path: hand-${{ matrix.goos }}-${{ matrix.goarch }}.*

  npm-publish:
    name: Publish npm packages
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Pin npm
        run: npm install -g npm@12.0.2
      - name: Generate npm packages for this release
        run: |
          set -eu
          commit='${{ needs.release-please.outputs.sha }}'
          test "$(git rev-parse HEAD)" = "$commit"
          packaging/npm/generate.sh --version "${{ needs.release-please.outputs.version }}" --commit "$commit"
      - name: Publish every runtime-qualified platform package, then the meta package
        env:
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -eu
          version="${{ needs.release-please.outputs.version }}"
          repo_url='git+https://github.com/atqamz/hand.git'
          pack_dir="$(mktemp -d)"
          trap 'rm -rf "$pack_dir"' EXIT
          publish_one() {
            local dir="$1" pack_json name tarball integrity
            pack_json="$(cd "$dir" && npm pack --json --pack-destination "$pack_dir")"
            # npm pack --json is an object keyed by package name, not an array (verified
            # against the pinned npm version above; tests/release enforces the pin). Each
            # value is piped through tr to drop a stray CR a chained jq -r can emit.
            name="$(printf '%s' "$pack_json" | jq -r 'to_entries[0].value.name' | tr -d '\r')"
            tarball="$(printf '%s' "$pack_json" | jq -r 'to_entries[0].value.filename' | tr -d '\r')"
            integrity="$(printf '%s' "$pack_json" | jq -r 'to_entries[0].value.integrity' | tr -d '\r')"
            .github/scripts/npm-publish-target.sh "$name" "$version" "$pack_dir/$tarball" "$integrity" "$repo_url"
          }
          # Platforms first: the meta package's optionalDependencies must never point
          # at a platform version that is not itself already published.
          for target in $(packaging/npm/generate.sh --print-targets | jq -r '.[]' | tr -d '\r'); do
            publish_one "packaging/npm/platforms/$target"
          done
          publish_one "packaging/npm/meta"

  publish:
    name: Publish release assets
    # Deliberately independent of npm-publish: the GitHub release is the primary
    # distribution channel and npm is additional, so a pending operator approval, a
    # rejected gate, or an npm outage must never hold back the primary one.
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Prepare release-bound adoption assets
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -eu
          RELEASE_COMMIT='${{ needs.release-please.outputs.sha }}'
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          .github/scripts/prepare-release.sh "$RELEASE_TAG" "$RELEASE_VERSION" "$RELEASE_COMMIT" .
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            hand-*.tar.gz
            hand-*.zip
            bootstrap.sh
            bootstrap.ps1
            checksums.txt
          draft: true
          fail_on_unmatched_files: true
      - name: Verify complete draft before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -eu
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in \
            hand-linux-amd64.tar.gz \
            hand-linux-arm64.tar.gz \
            hand-darwin-amd64.tar.gz \
            hand-darwin-arm64.tar.gz \
            hand-windows-amd64.zip \
            bootstrap.sh \
            bootstrap.ps1 \
            checksums.txt; do
            printf '%s\n' "$assets" | grep -Fx "$asset" >/dev/null
          done
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
