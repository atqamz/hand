name: Expensive mutation evidence

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  mutation-expensive:
    name: Mutation expensive (${{ matrix.package }})
    continue-on-error: true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/store
            name: store
            flags: --workers=2 --test-cpu=1 --timeout-coefficient=5
          - package: ./internal/runtime
            name: runtime
            flags: --workers=2 --test-cpu=1 --timeout-coefficient=9
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0
      - name: Run non-blocking mutation evidence
        run: |
          mkdir -p mutation-results
          make mutation PKG="${{ matrix.package }}" GREMLINS_FLAGS="${{ matrix.flags }} -o mutation-results/results.json"
      - name: Summarize mutation evidence
        if: always()
        run: |
          {
            echo "source: $(git rev-parse HEAD)"
            echo "tool: github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0"
            echo "tags: test"
            echo "package: ${{ matrix.package }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if test -s mutation-results/results.json; then
            jq -c '{go_module, mutants_total, mutants_killed, mutants_lived, mutants_not_covered, elapsed_time} + {mutants_timed_out: ([.files[].mutations[] | select(.status == "TIMED OUT")] | length)}' mutation-results/results.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo 'Mutation evidence was missing or incomplete.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-expensive-${{ matrix.name }}
          path: mutation-results/results.json
          if-no-files-found: warn
          retention-days: 14
