name: Dogfood failure (macOS)
description: A check in docs/dogfood/macos.md failed on a real machine
title: "M?: summary"
labels: ["bug", "platform: macos"]
body:
  - type: markdown
    attributes:
      value: |
        File one issue per failed check. Replace the `?` in the title with your check number, so that the title starts with the check ID: a search for the same check finds it by its title. Search open issues for the same check ID first, and add your evidence to that issue as a comment when one exists. Replace your user name, home folder and machine name with `<user>`, `<home>` and `<machine>`, and never paste a token or a login link.
  - type: input
    id: check
    attributes:
      label: Check ID
      placeholder: "M2"
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: Run issue
      description: Link to the dogfood run issue this check belongs to.
      placeholder: https://github.com/atqamz/hand/issues/0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: hand version
      description: The first lines of `hand version`, which give the version, the channel and the commit.
      placeholder: 0.11.0 stable
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 15.1 (arm64)
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: The steps of the check that you ran, with the exact commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: The expected result the check states.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Redacted command output, as text.
      render: text
    validations:
      required: true
