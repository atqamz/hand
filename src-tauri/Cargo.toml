[package]
name = "hand-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Hand's Android Companion"
license = "MIT"
publish = false

[lib]
name = "hand_android_lib"
crate-type = ["cdylib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
hand-android-core = { path = "../core" }
tauri = { version = "=2.12.5", default-features = false, features = ["wry"] }
