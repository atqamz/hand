[package]
name = "hand-android-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "The Rust core of Hand's Android Companion, with no Tauri in it"
license = "MIT"
publish = false

[dependencies]
iroh = "=1.4.1"
rand = "=0.10.3"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "io-util", "net", "sync", "time", "macros"] }
url = "=2.5.8"

[dev-dependencies]
serde_json = "=1.0.154"
socket2 = "=0.6.5"
